# =============================================================================
# GitHub Actions: test builds only
# =============================================================================
# Intentionally omitted for this project:
#   - Playwright/Cypress video recording
#   - Screenshot / visual regression capture
# =============================================================================

name: Build checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create placeholder .env for CI
        run: cp .env.example .env

      - name: Make test script executable
        run: chmod +x scripts/test-builds.sh

      - name: Run build checks
        run: ./scripts/test-builds.sh
